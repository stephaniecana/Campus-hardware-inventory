{% extends "base.html" %}
{% block title %}Register - Campus Hardware Inventory{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-3">
            <div class="card-header bg-success text-white py-3">
                <h4 class="mb-0 text-center fw-bold">Create Account</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Letters, numbers, underscores" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="user@laboratory.local" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="8+ chars, Uppercase, Number, Special char" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Account Role</label>
                        <select name="role" class="form-select">
                            <option value="USER" selected>USER</option>
                            <option value="ADMIN">ADMIN</option>
                        </select>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success">Register</button>
                    </div>
                </form>
                <div class="mt-3 text-center">
                    <small class="text-muted">Already registered? <a href="{{ url_for('login') }}">Back to Login</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
