{% extends "base.html" %}
{% block title %}Password Reset Request{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-warning text-dark py-3">
                <h4 class="mb-0 text-center fw-bold">Reset / Unlock Password</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted small">Submit your request. An Administrator will review and approve your new password.</p>
                <form action="{{ url_for('reset_request') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Registered Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Desired New Password</label>
                        <input type="password" name="new_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-warning">Submit Request</button>
                    </div>
                </form>
                <div class="mt-3 text-center">
                    <a href="{{ url_for('login') }}" class="small text-decoration-none">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
