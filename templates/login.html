{% extends "base.html" %}
{% block title %}Login - Campus Hardware Inventory{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0 fw-bold">Sign In</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" value="{{ locked_username or '' }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Log In</button>
                    </div>
                </form>

                {% if locked %}
                <div class="alert alert-danger mt-3 mb-0" role="alert">
                    <strong>Account Locked:</strong> 3 failed attempts reached. 
                    <a href="{{ url_for('reset_request') }}" class="alert-link">Submit an unlock request here</a>.
                </div>
                {% endif %}

                <hr class="my-4">
                <div class="d-flex justify-content-between text-muted small">
                    <a href="{{ url_for('register') }}" class="text-decoration-none">Create an account</a>
                    <a href="{{ url_for('reset_request') }}" class="text-decoration-none">Reset / Unlock Password</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
